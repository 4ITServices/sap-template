# =============================================================================
# SYNKRONIC Python Project Template
# Usage: copier copy gh:4ITServices/sap-template ./my-project
# =============================================================================

_subdirectory: template
_answers_file: .copier-answers.yml
_min_copier_version: "9.0"

# Generated once, then project-owned — `copier update` never overwrites them.
# .abapgit.xml: abapGit on the SAP side rewrites this file (UTF-8 BOM, IGNORE
# list churn), so re-rendering it on every update only manufactures conflicts.
_skip_if_exists:
  - .devcontainer/mcp-servers.conf
  - .devcontainer/dbt.conf
  - profiles/dbt.env
  - .abapgit.xml

# Type-specific files are excluded via Jinja conditions in their path names
# ({% if ... %}name{% endif %}), NOT via rm _tasks: tasks re-run on every
# `copier update` and would delete files a project hand-added later (e.g.
# .abapgit.xml / abap/ in a project generated as mcp-server).
#
# The reverse case — a SHARED file that one type must not get — is listed
# here instead of renaming the shared file. dbt-project is not a Python
# package: its root only carries the tooling, the dbt code lives in the v1/
# and v2/ worktrees. An excluded path is never rendered nor compared, so a
# file hand-added there later is left alone by `copier update`.
_exclude:
  - "{% if project_type == 'dbt-project' %}/pyproject.toml{% endif %}"
  - "{% if project_type == 'dbt-project' %}/.python-version{% endif %}"
  - "{% if project_type == 'dbt-project' %}/Dockerfile{% endif %}"
  - "{% if project_type == 'dbt-project' %}/src{% endif %}"
  - "{% if project_type == 'dbt-project' %}/tests{% endif %}"
  - "{% if project_type == 'dbt-project' %}/.github/workflows/ci.yml{% endif %}"
  # (no workflow left without IaC: skip the folder rather than leave it empty)
  - "{% if project_type == 'dbt-project' and not enable_iac %}/.github{% endif %}"

# =============================================================================
# Questions
# =============================================================================

project_name:
  type: str
  help: "Nom du projet (kebab-case, ex: sap-adt-mcp)"
  validator: >-
    {% if not (project_name | regex_search('^[a-z][a-z0-9-]+$')) %}
    Le nom doit être en kebab-case minuscules (ex: sap-adt-mcp)
    {% endif %}

project_slug:
  type: str
  help: "Nom du package Python (snake_case, auto-dérivé — modifier si besoin)"
  default: "{{ project_name | replace('-', '_') }}"

project_description:
  type: str
  help: "Description courte du projet (une ligne)"

project_type:
  type: str
  help: "Type de projet (conditionne les dépendances, Dockerfile, CLAUDE.md)"
  choices:
    - mcp-server
    - abap-project
    - fabric-pipeline
    - dbt-project
    - base
  default: mcp-server

python_version:
  type: str
  help: "Version Python"
  default: "3.12"

author_name:
  type: str
  help: "Nom de l'auteur / organisation"
  default: "SYNKRONIC"

author_email:
  type: str
  help: "Email de l'auteur"
  default: "jeanbaptiste.mack@outlook.com"

github_org:
  type: str
  help: "Organisation ou username GitHub"
  default: "4ITServices"

enable_iac:
  type: bool
  default: false
  help: "Activer l'Infrastructure as Code (OpenTofu + Bicep + Azure CLI) ?"

iac_short_name:
  type: str
  help: "Nom court IaC pour le naming Azure (max 10 chars, ex: 4it, zexplore)"
  default: "{{ project_name | replace('sap-', '') | replace('-', '') | truncate(10, True, '') }}"
  when: "{{ enable_iac }}"

abap_package_name:
  type: str
  help: "Nom du package ABAP cible (ex: ZEXPLORE)"
  default: "{{ project_name | upper | replace('SAP-', '') | replace('-', '') }}"
  when: "{{ project_type == 'abap-project' }}"

enable_ecc_stack:
  type: bool
  default: false
  help: >-
    Activer un second serveur sap-adt-mcp ciblant SAP ECC EHP8 (NW 7.50) sur
    le port 8001 en plus du S/4HANA sur 8000 ? Génère .env.ecc.example, ajoute
    une entrée sap-adt-ecc dans .mcp.json.example et lance mcp-server-ecc.sh
    en post-start si .env.ecc existe.
  when: "{{ project_type in ['mcp-server', 'abap-project', 'dbt-project'] }}"

# --- dbt-project : reprise d'un projet dbt BigQuery existant ------------------
# Ces réponses amorcent .devcontainer/dbt.conf, qui devient ensuite la
# propriété du projet (_skip_if_exists) : c'est LUI que les hooks lisent.

upstream_repo_url:
  type: str
  help: >-
    URL git du dépôt dbt d'origine à reprendre, en SSH de préférence
    (ex: git@gitlab.example.com:data/my-dwh.git). Il est lu, jamais poussé :
    le container verrouille tout push vers cet hôte.
  default: ""
  when: "{{ project_type == 'dbt-project' }}"
  validator: >-
    {% if project_type == 'dbt-project' and not (upstream_repo_url | regex_search('^(ssh://|https://|[A-Za-z0-9._-]+@[A-Za-z0-9.-]+:).+')) %}
    URL git attendue (git@hôte:groupe/depot.git, ssh://… ou https://…)
    {% endif %}

upstream_branch:
  type: str
  help: "Branche d'origine à reprendre (celle qui part en production)"
  default: main
  when: "{{ project_type == 'dbt-project' }}"

dbt_project_subdir:
  type: str
  help: >-
    Dossier du projet dbt DANS le dépôt d'origine (celui qui contient
    dbt_project.yml), ex: dbt. « . » = racine du dépôt. Vide = détection
    automatique, possible si le dépôt ne contient qu'un seul dbt_project.yml.
  default: ""
  when: "{{ project_type == 'dbt-project' }}"
  validator: >-
    {% if dbt_project_subdir and dbt_project_subdir != '.' and not (dbt_project_subdir | regex_search('^[A-Za-z0-9_][A-Za-z0-9_./-]*$')) or '..' in dbt_project_subdir %}
    Chemin relatif simple attendu (ex: dbt), sans « .. »
    {% endif %}

bq_sandbox_project:
  type: str
  help: >-
    Projet GCP bac à sable : le SEUL où dbt a le droit d'écrire (profil dbt
    généré + garde-fou d'écriture). Vide = aucun profil généré : dbt refuse
    de s'exécuter tant que profiles/profiles.yml n'est pas renseigné à la main.
  default: ""
  when: "{{ project_type == 'dbt-project' }}"

bq_sandbox_dataset:
  type: str
  help: "Dataset par défaut du profil dbt dans le bac à sable (ex: JDOE_dbt_run)"
  default: ""
  when: "{{ project_type == 'dbt-project' and bq_sandbox_project != '' }}"

bq_dataset_prefix:
  type: str
  help: >-
    Préfixe exigé pour tout dataset où dbt écrit (ex: JDOE). Le garde-fou
    refuse une écriture qui viserait un dataset sans ce préfixe. Vide = pas
    de contrôle de préfixe (le contrôle du projet reste actif).
  default: ""
  when: "{{ project_type == 'dbt-project' and bq_sandbox_project != '' }}"

bq_location:
  type: str
  help: "Région BigQuery du profil dbt"
  default: EU
  when: "{{ project_type == 'dbt-project' and bq_sandbox_project != '' }}"

dbt_target_name:
  type: str
  help: >-
    Nom du target du profil dbt. Les macros qui branchent sur target.name
    voient CE nom : mettre prd pour compiler comme en production tout en
    écrivant dans le bac à sable.
  default: dev
  when: "{{ project_type == 'dbt-project' and bq_sandbox_project != '' }}"

enable_tmux_claude_code_config:
  type: bool
  default: false
  help: >-
    Générer un snippet tmux OPTIONNEL (+ doc) pour fiabiliser le scroll et le
    copy-mode de Claude Code en sessions longues. Sourçable à la main, ne
    modifie jamais ~/.tmux.conf. Crée .config/tmux/claude-code.tmux.conf et
    docs/claude-code-tmux.md.

claude_profile:
  type: str
  default: ""
  help: >-
    Profil Claude Code de ce container (un compte/abonnement par profil).
    Vide = comportement historique : le ~/.claude de l'hôte, partagé par tous
    les containers (un /login bascule tous les autres). Renseigné (ex:
    sap-testing) = ~/.claude-profiles/<profil> de l'hôte monté sur ~/.claude :
    login, historique et mémoire propres au profil, persistés côté hôte.
    Donner le même profil à deux dépôts leur fait partager le même compte.
    Migration de l'historique : .devcontainer/README.md (« Claude profiles »).
  validator: >-
    {% if claude_profile and not (claude_profile | regex_search('^[a-z0-9][a-z0-9_-]{0,62}$')) %}
    Profil invalide : minuscules, chiffres, - et _ uniquement, 63 caractères max (ex: sap-testing)
    {% endif %}

workspace_color:
  type: str
  help: "Couleur de la barre d'activité VS Code (hex, ex: #6B7280)"
  default: >-
    {%- if project_type == "mcp-server" %}#1E3A5F
    {%- elif project_type == "abap-project" %}#3D1A00
    {%- elif project_type == "fabric-pipeline" %}#0E2A1A
    {%- elif project_type == "dbt-project" %}#9A3412
    {%- elif project_type == "base" %}#374151
    {%- endif %}
