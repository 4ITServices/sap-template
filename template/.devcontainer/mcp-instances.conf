# =============================================================================
# Instances SUPPLÉMENTAIRES d'un serveur MCP de mcp-servers.conf
# (.devcontainer/mcp-instance.sh), chacune vers un autre système.
#
# Une instance par ligne :
#   NOM  SERVEUR  PORT  PRÉFIXE
#   NOM      — nom de l'entrée dans .mcp.json (http://127.0.0.1:PORT/mcp)
#   SERVEUR  — dossier /opt/SERVEUR (installé par mcp-servers.conf)
#   PORT     — port local de l'instance
#   PRÉFIXE  — ses variables : PRÉFIXE_SAP_URL, PRÉFIXE_SAP_USER… (.env.refs ou
#              .env), reprises en SAP_URL, SAP_USER… pour CETTE instance seule
#
# Exemple (BCA de MH, joint par tunnels.conf) :
#   sap-adt-bca  sap-adt-mcp  8020  BCA
# avec BCA_SAP_URL=https://mhgcs4hapb01.mh.lvmh:44320 et l'entrée .mcp.json
#   "sap-adt-bca": { "type": "http", "url": "http://127.0.0.1:8020/mcp" }
#
# Fichier du PROJET (copier _skip_if_exists) : `copier update` ne l'écrase pas.
# =============================================================================
