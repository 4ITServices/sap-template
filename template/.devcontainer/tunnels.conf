# =============================================================================
# Tunnels SSH vers des machines relais (.devcontainer/lib-tunnels.sh)
#
# Une redirection par ligne :
#   NOM  UTILISATEUR@HÔTE[:PORT_SSH]  PORT_LOCAL  CIBLE:PORT  [VARIABLE_CLÉ]
#   NOM          — libellé (journal, status)
#   HÔTE         — le relais ; ses lignes partagent une seule session ssh
#   PORT_LOCAL   — écoute sur 127.0.0.1 dans le container
#   CIBLE:PORT   — résolu et joint PAR LE RELAIS (ex. un SAP derrière son VPN) ;
#                  127.0.0.1:PORT = un service qui tourne sur le relais lui-même
#   VARIABLE_CLÉ — variable qui porte la clé privée (Key Vault : une référence
#                  kv:// dans .env.refs, PEM ou base64 sur une ligne ; .env : un
#                  chemin). Jamais écrite sur disque : ssh-agent du tunnel.
# Une CIBLE nommée dont PORT_LOCAL = PORT est mise en 127.0.0.1 dans /etc/hosts :
# l'URL garde le vrai nom (certificat TLS), le trafic passe par le tunnel.
# Clé d'hôte du relais : `bash .devcontainer/tunnel.sh epingler`, comparer les
# empreintes, versionner tunnels.known_hosts.
#
# Exemple (SAP de MH derrière le VPN de vm-mh-win11) :
#   bca     adm-mh@20.216.149.143  44320  mhgcs4hapb01.mh.lvmh:44320  VM_MH_SSH_KEY
#   qls     adm-mh@20.216.149.143  8007   frmhis13.mh.lvmh:8007       VM_MH_SSH_KEY
#   mh-gui  adm-mh@20.216.149.143  8021   127.0.0.1:8001              VM_MH_SSH_KEY
#
# Fichier du PROJET (copier _skip_if_exists) : `copier update` ne l'écrase pas.
# =============================================================================
