# =============================================================================
# claude-code.tmux.conf — réglages tmux OPTIONNELS pour Claude Code
# -----------------------------------------------------------------------------
# But : fiabiliser le scroll et le copy-mode de Claude Code lors de sessions
# longues (SSH, devcontainer, host qui dort) où la molette, le scrollback du
# terminal et la TUI Claude Code peuvent entrer en conflit.
#
# Ce fichier ne s'applique PAS tout seul et ne modifie JAMAIS votre ~/.tmux.conf.
#
#   Essai immédiat (session courante uniquement) :
#       tmux source-file .config/tmux/claude-code.tmux.conf
#
#   Adoption durable — ajoutez cette ligne à votre ~/.tmux.conf :
#       source-file ~/.config/tmux/claude-code.tmux.conf
#   (copiez d'abord ce fichier : cp .config/tmux/claude-code.tmux.conf ~/.config/tmux/)
#
# Guide complet (copy-mode, alternate screen, stratégies de scroll) :
#   docs/claude-code-tmux.md
# =============================================================================

# Molette + sélection souris : scroll dans le pane, entrée auto en copy-mode.
set -g mouse on

# Historique large : indispensable pour relire de longues sorties Claude Code.
# NB : ne s'applique qu'aux panes ouverts APRÈS le source ; un pane déjà ouvert
# garde son ancien scrollback (ouvrez une nouvelle fenêtre/pane pour en profiter).
set -g history-limit 50000

# Laisse passer les séquences d'échappement des applis (TUI Claude Code, images,
# OSC 52 pour le presse-papiers) au lieu de les filtrer.
set -g allow-passthrough on

# Touches étendues (xterm) : désambiguïse Ctrl/Alt/Shift, utile pour la TUI.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
